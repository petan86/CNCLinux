<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 960 560" width="960" height="560"><style>text{font-family:Consolas,"DejaVu Sans Mono",monospace;font-size:12px;fill:#1d2420}.t-title{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700}.t-muted{fill:#5d6a63;font-size:11px}.t-bad{fill:#c8322b;font-weight:600}.t-used{font-weight:600}</style><rect width="960" height="560" fill="#ffffff"/>
        <!-- 24V PSU -->
        <rect x="40" y="30" width="220" height="78" rx="6" fill="#ffffff" stroke="#c8322b" stroke-width="2"/>
        <text x="56" y="58" class="t-title">Zdroj 24 V DC</text>
        <text x="56" y="80" class="t-muted">min. 1 A, z 230 V sítě</text>
        <text x="90" y="100" class="t-muted">+V</text>
        <text x="196" y="100" class="t-muted">−V</text>
        <!-- PSU wires -->
        <path d="M100 108 V 205" stroke="#c8322b" stroke-width="3" fill="none"/>
        <path d="M206 108 V 205" stroke="#2b2b2b" stroke-width="3" fill="none"/>

        <!-- EC300 board -->
        <rect x="30" y="170" width="380" height="350" rx="8" fill="#e3efe8" stroke="#2f6b4f" stroke-width="2"/>
        <text x="50" y="500" class="t-title" style="fill:#2f6b4f">EC300</text>
        <text x="118" y="500" class="t-muted">i.MX RT1052</text>
        <!-- power terminal -->
        <rect x="70" y="205" width="170" height="44" rx="4" fill="#ffffff" stroke="#2f6b4f"/>
        <circle cx="100" cy="227" r="9" fill="#ffffff" stroke="#c8322b" stroke-width="2"/>
        <circle cx="206" cy="227" r="9" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
        <text x="115" y="231">+24V</text>
        <text x="150" y="231">GND</text>
        <text x="70" y="268" class="t-muted">svorka napájení (ověř popis na desce)</text>

        <!-- driver outputs / inputs placeholder -->
        <rect x="50" y="290" width="200" height="56" rx="4" fill="none" stroke="#d5dbd6" stroke-dasharray="5 4"/>
        <text x="62" y="313" class="t-muted">STEP/DIR, vstupy, výstupy</text>
        <text x="62" y="332" class="t-muted">při flashování nezapojovat</text>
        <!-- RJ45 -->
        <rect x="50" y="370" width="110" height="64" rx="4" fill="#ffffff" stroke="#2f6b4f"/>
        <text x="62" y="396">Ethernet</text>
        <text x="62" y="416" class="t-muted">až po flashi</text>

        <!-- SWD header -->
        <rect x="300" y="300" width="110" height="130" rx="4" fill="#ffffff" stroke="#2f6b4f" stroke-width="2"/>
        <text x="300" y="292" class="t-muted">konektor P1 (SWD)</text>
        <g>
          <rect x="392" y="313" width="14" height="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
          <text x="310" y="324">4 · GND</text>
          <rect x="392" y="343" width="14" height="14" fill="#ffffff" stroke="#c98a00" stroke-width="2"/>
          <text x="310" y="354">3 · SWCLK</text>
          <rect x="392" y="373" width="14" height="14" fill="#ffffff" stroke="#1f63c4" stroke-width="2"/>
          <text x="310" y="384">2 · SWDIO</text>
          <rect x="392" y="403" width="14" height="14" fill="#ffffff" stroke="#5d6a63" stroke-width="2"/>
          <text x="310" y="414">1 · reset</text>
        </g>
        <text x="420" y="414" class="t-bad">✕ nepřipojovat</text>
        <text x="230" y="452" class="t-muted">P1 je vedle ethernetu a tlačítka,</text>
        <text x="230" y="468" class="t-muted">pin 1 je nejblíž ethernetu</text>

        <!-- Wires SWD -> Pico -->
        <path d="M406 320 H 480 V 240 H 620" stroke="#2b2b2b" stroke-width="3" fill="none"/>
        <path d="M406 350 H 520 V 270 H 620" stroke="#c98a00" stroke-width="3" fill="none"/>
        <path d="M406 380 H 560 V 300 H 620" stroke="#1f63c4" stroke-width="3" fill="none"/>

        <!-- PC -->
        <rect x="610" y="30" width="190" height="60" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
        <text x="626" y="56" class="t-title">PC (Surface)</text>
        <text x="626" y="76" class="t-muted">pyOCD, USB</text>
        <path d="M690 90 V 132" stroke="#6b7280" stroke-width="5" fill="none"/>
        <text x="702" y="118" class="t-muted">USB kabel (data)</text>

        <!-- Pico -->
        <rect x="665" y="132" width="50" height="22" rx="3" fill="#ffffff" stroke="#2c7a3f" stroke-width="2"/>
        <rect x="620" y="150" width="140" height="350" rx="8" fill="#e8f4ea" stroke="#2c7a3f" stroke-width="2"/>
        <text x="650" y="480" class="t-title" style="fill:#2c7a3f">Pico</text>
        <text x="650" y="462" class="t-muted">debugprobe</text>
        <!-- left header pins 1..8 -->
        <g>
          <circle cx="630" cy="180" r="6" fill="#ffffff" stroke="#5d6a63"/><text x="644" y="184" class="t-muted">1 GP0</text>
          <circle cx="630" cy="210" r="6" fill="#ffffff" stroke="#5d6a63"/><text x="644" y="214" class="t-muted">2 GP1</text>
          <circle cx="630" cy="240" r="6" fill="#2b2b2b"/><text x="644" y="244" class="t-used">3 GND</text>
          <circle cx="630" cy="270" r="6" fill="#c98a00"/><text x="644" y="274" class="t-used">4 GP2</text>
          <circle cx="630" cy="300" r="6" fill="#1f63c4"/><text x="644" y="304" class="t-used">5 GP3</text>
          <circle cx="630" cy="330" r="6" fill="#ffffff" stroke="#5d6a63"/><text x="644" y="334" class="t-muted">6 GP4 TX</text>
          <circle cx="630" cy="360" r="6" fill="#ffffff" stroke="#5d6a63"/><text x="644" y="364" class="t-muted">7 GP5 RX</text>
          <circle cx="630" cy="390" r="6" fill="#ffffff" stroke="#5d6a63"/><text x="644" y="394" class="t-muted">8 GND</text>
        </g>
        <!-- right side power pins, not used -->
        <text x="776" y="184" class="t-muted">40 VBUS</text>
        <text x="776" y="244" class="t-muted">36 3V3</text>
        <text x="776" y="264" class="t-bad">✕ k EC300</text>
        <text x="776" y="284" class="t-bad">nepřipojovat</text>
        <circle cx="750" cy="180" r="6" fill="#ffffff" stroke="#5d6a63"/>
        <circle cx="750" cy="240" r="6" fill="#ffffff" stroke="#5d6a63"/>
        <text x="776" y="334" class="t-muted">GP4/GP5 = UART</text>
        <text x="776" y="352" class="t-muted">(COM3), volitelné</text>
      <rect x="40" y="532" width="26" height="4" fill="#c98a00"/><text x="74" y="538">SWCLK</text><rect x="150" y="532" width="26" height="4" fill="#1f63c4"/><text x="184" y="538">SWDIO</text><rect x="260" y="532" width="26" height="4" fill="#2b2b2b"/><text x="294" y="538">GND</text><rect x="350" y="532" width="26" height="4" fill="#c8322b"/><text x="384" y="538">+24 V</text><rect x="450" y="532" width="26" height="4" fill="#6b7280"/><text x="484" y="538">USB</text></svg>
